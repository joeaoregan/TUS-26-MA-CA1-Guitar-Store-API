---
- name: Deploy Guitar Store API to Docker Host
  hosts: all
  become: true
  tasks:
    - name: Stop existing container
      command: docker stop guitar-store-api-container
      ignore_errors: yes

    - name: Remove existing container
      command: docker rm guitar-store-api-container
      ignore_errors: yes

    - name: Pull latest image from Docker Hub
      command: docker pull {{ docker_user }}/guitar-store-api:latest

    - name: Run new container
      command: docker run -d --name guitar-store-api-container -p 8080:8080 {{ docker_user }}/guitar-store-api:latest 