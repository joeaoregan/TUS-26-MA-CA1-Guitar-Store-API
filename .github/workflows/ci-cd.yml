name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: "Stage 1: Compile"
        run: mvn clean compile -Dcheckstyle.skip
        
      - name: "Stage 2: Test"
        run: mvn test

      - name: "Stage 3: Package"
        run: mvn package -DskipTests -Dcheckstyle.skip

      - name: "Stage 4: SonarCloud"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.token=${SONAR_TOKEN}

      - name: "Stage 5/6: Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Stage 5/6: Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: joe0regan/guitar-store-api:latest
