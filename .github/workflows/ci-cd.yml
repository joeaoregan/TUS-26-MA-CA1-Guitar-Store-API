name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: "Stage 1: Compile"
        run: mvn clean compile -Dcheckstyle.skip
        
      - name: "Stage 2: Test"
        run: mvn test

      - name: "Stage 3: Package"
        run: mvn package -DskipTests -Dcheckstyle.skip

