name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: "Stage 1: Compile"
        run: mvn clean compile -Dcheckstyle.skip
        
      - name: "Stage 2: Test"
        run: mvn test

      - name: "Stage 3: Package"
        run: mvn package -DskipTests -Dcheckstyle.skip

      - name: "Stage 4: SonarCloud"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.token=${SONAR_TOKEN}

      - name: "Stage 5/6: Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Stage 5/6: Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: joe0regan/guitar-store-api:latest

      # Debugging step to check if the ANSIBLE_HOST secret is correctly set and resolvable
      - name: "Debug: DNS check"
        run: |
          python - <<'PY'
          import os, socket
          host = os.environ.get("ANSIBLE_HOST","")
          print("host length:", len(host))
          print("host startswith https:", host.startswith("https://"))
          try:
            print("resolved:", socket.gethostbyname(host))
          except Exception as e:
            print("resolve failed:", e)
          PY
        env:
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
        # Delete this step after confirming the ANSIBLE_HOST value is correct and resolvable ^^^

      - name: "Stage 7/8: Copy deploy files to Ansible server with SSH"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ANSIBLE_HOST }}
          username: ${{ secrets.ANSIBLE_USER }}
          key: ${{ secrets.ANSIBLE_SSH_KEY }}
          source: "deploy-guitar-api.yml,Dockerfile"
          target: "/opt/docker"

