name: CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: "Stage 1: Compile"
        run: mvn clean compile -Dcheckstyle.skip

      - name: "Stage 2: Test + Coverage (JaCoCo)"
        run: mvn test jacoco:report

      - name: "Stage 3: Package"
        run: mvn package -DskipTests -Dcheckstyle.skip

      - name: "Stage 4: SonarCloud"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar -Dsonar.token=${SONAR_TOKEN}

      - name: "Stage 5/6: Docker login"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Stage 5/6: Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: joe0regan/guitar-store-api:latest

      - name: "Stage 7: Copy deploy files to Ansible server (SCP)"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ANSIBLE_HOST }}
          username: ${{ secrets.ANSIBLE_USER }}
          password: ${{ secrets.ANSIBLE_PASSWORD }}
          source: "deploy-guitar-api.yml,Dockerfile"
          target: "/opt/docker"
          overwrite: true

      - name: "Stage 8: Run Ansible playbook remotely"
        shell: bash
        env:
          ANSIBLE_HOST: ${{ secrets.ANSIBLE_HOST }}
          ANSIBLE_USER: ${{ secrets.ANSIBLE_USER }}
          SSHPASS: ${{ secrets.ANSIBLE_PASSWORD }} 
        run: |
          # Install sshpass non-interactively
          sudo apt-get update -y && sudo apt-get install -y sshpass
          
          # Execute the playbook. 
          sshpass -e ssh -o StrictHostKeyChecking=no ${ANSIBLE_USER}@${ANSIBLE_HOST} \
            "cd /opt/docker && echo '$SSHPASS' | sudo -S ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i /etc/ansible/hosts deploy-guitar-api.yml"